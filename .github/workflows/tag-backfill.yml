name: Production release tag recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/historical-release-tags.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing annotated historical release tags
        run: |
          set -euo pipefail
          git fetch --tags --force
          python - <<'PY'
          import json
          import subprocess

          with open("ops/historical-release-tags.json", encoding="utf-8") as f:
              releases = json.load(f)["releases"]

          for release in releases:
              tag = release["tag"]
              target = release["target"]
              summary = release["summary"]

              subprocess.run(["git", "rev-parse", "--verify", f"{target}^{{commit}}"], check=True, stdout=subprocess.DEVNULL)
              existing = subprocess.run(
                  ["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if existing.returncode == 0:
                  print(f"Tag {tag} already exists; skipping.")
                  continue

              print(f"Creating annotated tag {tag} -> {target}")
              subprocess.run(
                  ["git", "tag", "-a", tag, target, "-m", summary],
                  check=True,
              )

          subprocess.run(["git", "push", "origin", "--tags"], check=True)
          PY
