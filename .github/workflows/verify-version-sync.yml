name: Verify automatic version commits

on:
  workflow_run:
    workflows: ["Automatic patch versioning"]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main after version automation
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run unit tests
        run: npm test
