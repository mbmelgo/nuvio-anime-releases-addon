name: temporary TVDB reader patch
on:
  push:
    branches:
      - fix/tvdb-jina-reader-fallback
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-tvdb-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch TVDB series-page resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/kitsu-canonical.js')
          s = p.read_text()
          s = s.replace('TVDB_SERIES_URL="https://thetvdb.com/series/"', 'TVDB_SERIES_URL="https://thetvdb.com/series/",TVDB_READER_URL="https://r.jina.ai/http://thetvdb.com/series/"')
          pattern = r'export async function resolveWithTvdbSeriesPageByTitle\(.*?\nexport async function resolveWithTvdbWebSearchByTitle'
          replacement = '''export async function resolveWithTvdbSeriesPageByTitle(titles,fetchImpl,now){const rawTitles=[...new Set((Array.isArray(titles)?titles:[titles]).map(value=>String(value||"").trim()).filter(Boolean))].slice(0,6);if(!rawTitles.length)return null;const key=rawTitles.map(normalizeTitle).filter(Boolean).sort().join("|");const cached=tvdbSeriesPageCache.get(key);if(cached&&cached.expiresAt>now)return cached.tvdbId||null;let tvdbId=null;for(const title of rawTitles){const slug=normalizeTitle(title).replace(/\\s+/g,"-");if(!slug)continue;try{let html=null;const direct=await fetchImpl(`${TVDB_SERIES_URL}${encodeURIComponent(slug)}`,{headers:{Accept:"text/html,application/xhtml+xml","User-Agent":"Mozilla/5.0"}});if(direct.ok)html=await direct.text();else{const reader=await fetchImpl(`${TVDB_READER_URL}${encodeURIComponent(slug)}`,{headers:{Accept:"text/plain","User-Agent":"Mozilla/5.0"}});if(reader.ok)html=await reader.text()}if(!html)continue;const match=html.match(/TheTVDB\\.com Series ID\\s*:?\\s*(\\d+)/i)||html.match(/series\\/(\\d+)/i);if(match?.[1]){tvdbId=String(match[1]);break}}catch{continue}}tvdbSeriesPageCache.set(key,{tvdbId,expiresAt:now+(tvdbId?CACHE_TTL_MS:NEGATIVE_CACHE_TTL_MS)});return tvdbId}
export async function resolveWithTvdbWebSearchByTitle'''
          s2 = re.sub(pattern, replacement, s, flags=re.S)
          if s2 == s:
              raise SystemExit('resolver replacement did not match')
          p.write_text(s2)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-tvdb-reader-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/kitsu-canonical.js .github/workflows/temp-tvdb-reader-patch.yml
          git commit -m "fix: use TVDB page reader fallback [skip-release-pipeline] [skip-tvdb-patch]"
          git push
