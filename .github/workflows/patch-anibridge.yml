name: Apply AniBridge canonicalization patch

on:
  push:
    branches: [fix/anibridge-tvdb-canonicalization]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonicalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/kitsu-canonical.js')
          s = p.read_text()
          s = s.replace('const MALSYNC_URL = "https://api.malsync.moe/mal/anime";\n', 'const MALSYNC_URL = "https://api.malsync.moe/mal/anime";\nconst ANIBRIDGE_URL = "https://mappings.anibridge.eliasbenb.dev/api/v3/mappings";\n')
          s = s.replace('const rootTvdbCache = new Map();\n', 'const rootTvdbCache = new Map();\nconst anibridgeTvdbCache = new Map();\n')
          old = '''  const resolvers = source.source === "mal"
    ? [resolveWithArmFromMal, resolveWithAniZipFromMal, resolveWithMalSync, resolveWithKitsuTitle]
    : [resolveWithArmFromAniList, resolveWithAniZipFromAniList, resolveWithKitsuTitle];
  for (const resolver of resolvers) {'''
          new = '''  let preferredTvdbId = null;
  try {
    preferredTvdbId = await resolveWithAniBridgeTvdb(source.source, source.id, fetchImpl, now);
  } catch (error) {
    if (process.env.NODE_ENV !== "test") console.warn(`[kitsu-canonical] AniBridge TVDB lookup failed for ${key}:`, error?.message || error);
  }
  const resolvers = source.source === "mal"
    ? [resolveWithArmFromMal, resolveWithAniZipFromMal, resolveWithMalSync, resolveWithKitsuTitle]
    : [resolveWithArmFromAniList, resolveWithAniZipFromAniList, resolveWithKitsuTitle];
  for (const resolver of resolvers) {'''
          if old not in s: raise SystemExit('resolver block not found')
          s = s.replace(old, new, 1)
          s = s.replace('let tvdbId = mappedTvdbId || await resolveKitsuToTvdb(kitsuId, fetchImpl, now);', 'let tvdbId = preferredTvdbId || mappedTvdbId || await resolveKitsuToTvdb(kitsuId, fetchImpl, now);', 1)
          marker = '  // A seasonal entry can legitimately have no current Kitsu mapping. Do not\n'
          insert = '''  if (preferredTvdbId) {
    const identity = { kitsuId: null, tvdbId: String(preferredTvdbId), tvdbSourceAnilistId: source.source === "anilist" ? String(source.id) : null };
    cache.set(key, { identity, expiresAt: now + CACHE_TTL_MS });
    return identity;
  }

'''
          if marker not in s: raise SystemExit('fallback marker not found')
          s = s.replace(marker, insert + marker, 1)
          old2 = '''    if (!media) continue;
    if (current.id !== startingId) {'''
          new2 = '''    if (!media) continue;
    const directTvdb = await resolveWithAniBridgeTvdb("anilist", String(media.id), fetchImpl, now);
    if (directTvdb) {
      const result = { tvdbId: String(directTvdb), anilistId: String(media.id), kitsuId: null };
      rootTvdbCache.set(cacheKey, { identity: result, expiresAt: now + CACHE_TTL_MS });
      return result;
    }
    if (current.id !== startingId) {'''
          if old2 not in s: raise SystemExit('root block not found')
          s = s.replace(old2, new2, 1)
          old3 = '  for (const resolver of [resolveWithArmFromAniList, resolveWithAniZipFromAniList, resolveWithKitsuTitle]) {'
          new3 = '''  const directTvdb = await resolveWithAniBridgeTvdb("anilist", anilistId, fetchImpl, now);
  if (directTvdb) return { kitsuId: null, tvdbId: String(directTvdb) };
  for (const resolver of [resolveWithArmFromAniList, resolveWithAniZipFromAniList, resolveWithKitsuTitle]) {'''
          if old3 not in s: raise SystemExit('node resolver block not found')
          s = s.replace(old3, new3, 1)
          marker2 = 'function parseSourceId(id) {'
          helper = '''async function resolveWithAniBridgeTvdb(source, id, fetchImpl, now) {
  const key = `${source}:${id}`;
  const cached = anibridgeTvdbCache.get(key);
  if (cached && cached.expiresAt > now) return cached.tvdbId || null;
  if (cached) anibridgeTvdbCache.delete(key);
  try {
    const data = await getJson(fetchImpl, ANIBRIDGE_URL, { provider: source, id, limit: "1000" });
    const sourceKey = Object.keys(data?.data || {}).find((value) => value.toLowerCase() === key.toLowerCase());
    const targets = sourceKey ? data.data[sourceKey] : null;
    const tvdbTargets = Object.keys(targets || {})
      .map((target) => {
        const match = String(target).match(/^tvdb_show:(\\d+)(?::s\\d+)?$/i);
        return match ? match[1] : null;
      })
      .filter(Boolean);
    const tvdbId = tvdbTargets[0] || null;
    anibridgeTvdbCache.set(key, { tvdbId, expiresAt: now + (tvdbId ? CACHE_TTL_MS : NEGATIVE_CACHE_TTL_MS) });
    return tvdbId;
  } catch (error) {
    anibridgeTvdbCache.set(key, { tvdbId: null, expiresAt: now + NEGATIVE_CACHE_TTL_MS });
    throw error;
  }
}

'''
          if marker2 not in s: raise SystemExit('parse marker not found')
          s = s.replace(marker2, helper + marker2, 1)
          s = s.replace('  rootTvdbCache.clear();\n}', '  rootTvdbCache.clear();\n  anibridgeTvdbCache.clear();\n}', 1)
          p.write_text(s)
          t = Path('test/kitsu-canonical.test.js')
          ts = t.read_text()
          addition = r'''

test("uses AniBridge TVDB mappings before provider-specific mappings", async () => {
  const fetchImpl = mockFetch([
    { match: (url) => url.includes("mappings.anibridge.eliasbenb.dev") && url.includes("provider=anilist") && url.includes("id=53876"), body: { data: { "anilist:53876": { "tvdb_show:433862:s1": {} } } } },
    { match: (url) => url.includes("arm.haglund.dev"), body: { kitsu: 46859 } },
    { match: (url) => url.includes("kitsu.io/api/edge/anime/46859/mappings"), body: { data: [{ attributes: { externalSite: "thetvdb/series", externalId: "76703" } }] } },
    { match: (url) => url.includes("kitsu.io/api/edge/anime/46859") && !url.includes("/mappings"), body: { data: { id: "46859", attributes: { canonicalTitle: "Pokémon Horizons: The Series", titles: { en: "Pokémon Horizons: The Series" } } } } },
  ]);
  const [meta] = await canonicalizeCatalogMetas([{ id: "anilist:53876", name: "Pokémon Horizons: The Series", type: "series" }], { fetchImpl, now: 1000 });
  assert.equal(meta.id, "tvdb:433862");
});

test("uses AniBridge when the Kitsu mapping has no TVDB relationship", async () => {
  const fetchImpl = mockFetch([
    { match: (url) => url.includes("mappings.anibridge.eliasbenb.dev") && url.includes("provider=anilist") && url.includes("id=196017"), body: { data: { "anilist:196017": { "tvdb_show:465802:s1": {} } } } },
    { match: (url) => url.includes("arm.haglund.dev"), body: { kitsu: 99999 } },
    { match: (url) => url.includes("kitsu.io/api/edge/anime/99999/mappings"), body: { data: [] } },
    { match: (url) => url.includes("kitsu.io/api/edge/anime/99999") && !url.includes("/mappings"), body: { data: { id: "99999", attributes: { canonicalTitle: "Grow Up Show: Himawari no Circus-dan", titles: { en: "Grow Up Show: Himawari no Circus-dan" } } } } },
  ]);
  const [meta] = await canonicalizeCatalogMetas([{ id: "anilist:196017", name: "Grow Up Show: Himawari no Circus-dan", type: "series" }], { fetchImpl, now: 1000 });
  assert.equal(meta.id, "tvdb:465802");
});
'''
          if 'uses AniBridge TVDB mappings before provider-specific mappings' not in ts:
            t.write_text(ts + addition)
          PY
      - name: Remove patch workflow and commit
        run: |
          rm -f .github/workflows/patch-anibridge.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/kitsu-canonical.js test/kitsu-canonical.test.js .github/workflows/patch-anibridge.yml
          git commit -m "fix: use AniBridge for authoritative TVDB canonicalization"
          git push
