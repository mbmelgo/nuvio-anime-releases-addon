name: Correct current production release tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: contains(github.event.head_commit.message, '[fix-release-tag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Correct current deployment tag
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('ops/release-state.json').read_text())['lastDeploymentVersion'])
          PY
          )"
          target_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('ops/release-state.json').read_text())['lastDeploymentSha'])
          PY
          )"
          IFS=. read -r major minor patch <<< "$source_version"
          expected_tag="v${major}.${minor}.0"
          wrong_tag="v${source_version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if ! git ls-remote --exit-code --tags origin "refs/tags/$expected_tag" >/dev/null 2>&1; then
            previous_tag="$(git tag --merged "$target_sha^" --sort=-version:refname --list 'v*' | head -n1 || true)"
            if [ -n "$previous_tag" ]; then
              changes="$(git log --reverse --no-merges --pretty=format:'- %s (%h)' "$previous_tag..$target_sha" | head -n 50 || true)"
            else
              changes="$(git log --reverse --no-merges --pretty=format:'- %s (%h)' "$target_sha" | head -n 50 || true)"
            fi
            [ -n "$changes" ] || changes="- Production changes included in the deployed source commit."
            git tag -a "$expected_tag" "$target_sha" -m "Release $expected_tag

Deployed source version: $source_version
Deployed source commit: $target_sha

Changes included:
$changes"
            git push origin "refs/tags/$expected_tag"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$wrong_tag" >/dev/null 2>&1 && [ "$wrong_tag" != "$expected_tag" ]; then
            git push origin --delete "$wrong_tag"
          fi
          echo "Corrected current production release tag to $expected_tag."
