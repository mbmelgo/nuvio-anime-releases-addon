name: apply-rich-meta

on:
  push:
    paths:
      - .github/workflows/apply-rich-meta.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify rich metadata unit tests before integration patch
        run: npm test

      - name: Patch v5 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          providers = Path('api/lib/providers.js')
          text = providers.read_text()
          expanded = '''const ANILIST_FIELDS = `id idMal format status episodes season seasonYear duration countryOfOrigin title{romaji english native} synonyms startDate{year month day} endDate{year month day} coverImage{large extraLarge} bannerImage trailer{id site thumbnail} genres averageScore relations{edges{relationType node{id idMal format status episodes season seasonYear title{romaji english native} synonyms startDate{year month day} endDate{year month day} coverImage{large extraLarge}}}}`;'''
          text, count = re.subn(r'const ANILIST_FIELDS = `.*?`;', expanded, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('ANILIST_FIELDS replacement target not found')
          providers.write_text(text)

          resolver = Path('api/meta-resolver-v5.js')
          text = resolver.read_text()
          old_import = 'import { reconcileEpisodeSequences } from "./lib/episode-sequences.js";'
          new_import = old_import + '\nimport { enrichMeta } from "./lib/rich-meta.js";'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('resolver import target not found')
              text = text.replace(old_import, new_import, 1)

          old_meta = 'const meta = buildMeta(root, requestedId, videos);'
          new_meta = 'const meta = enrichMeta(buildMeta(root, requestedId, videos), root, rootAniList, seasons);'
          if old_meta not in text:
              raise SystemExit('resolver metadata construction target not found')
          text = text.replace(old_meta, new_meta, 1)

          old_video = 'const video = { id: `${identity}:${targetSeason}:${episode}`, title: row.title || `Episode ${episode}`, season: targetSeason, episode };'
          new_video = 'const video = { id: `${identity}:${targetSeason}:${episode}`, title: row.title || `Episode ${episode}`, season: targetSeason, episode };\n      if (row.overview) video.overview = row.overview;\n      if (Number.isFinite(Number(row.runtime)) && Number(row.runtime) > 0) video.runtime = `${Number(row.runtime)}m`;'
          if old_video not in text:
              raise SystemExit('resolver video target not found')
          text = text.replace(old_video, new_video, 1)
          resolver.write_text(text)

          episodes = Path('api/lib/episodes.js')
          text = episodes.read_text()
          old_az = '''    title,\n    released,\n    thumbnail: item.image || null\n  };'''
          new_az = '''    title,\n    released,\n    thumbnail: item.image || null,\n    overview: item.overview || item.synopsis || item.description || null,\n    runtime: Number(item.runtime ?? item.duration ?? 0) || 0\n  };'''
          if old_az not in text:
              raise SystemExit('AniZip normalization target not found')
          text = text.replace(old_az, new_az, 1)

          old_jk = '''    title,\n    released,\n    thumbnail: item.images?.jpg?.image_url || null\n  };'''
          new_jk = '''    title,\n    released,\n    thumbnail: item.images?.jpg?.image_url || null,\n    overview: item.synopsis || item.overview || null,\n    runtime: Number(item.duration ?? 0) || 0\n  };'''
          if old_jk not in text:
              raise SystemExit('Jikan normalization target not found')
          text = text.replace(old_jk, new_jk, 1)
          episodes.write_text(text)
          PY

      - name: Run full test suite after integration patch
        run: npm test

      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-rich-meta.yml
          git add api/lib/providers.js api/meta-resolver-v5.js api/lib/episodes.js api/lib/rich-meta.js test/rich-meta.test.js .github/workflows/apply-rich-meta.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(meta): enrich v5 anime metadata"
          git push origin main
