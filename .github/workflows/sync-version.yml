name: Release and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full CI
        run: npm test

      - name: Continue release only for explicit deploy commit
        id: release_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch is recovery-only and does not authorize production deployment."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.head_commit.message }}" == *"[deploy-prod]"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        if: steps.release_gate.outputs.release == 'true'
        run: |
          node -e "const fs=require('fs'); const v=require('./api/version.js').VERSION; const s=JSON.parse(fs.readFileSync('ops/release-state.json')); if(v!==s.nextReleaseVersion) { console.error('Version mismatch:',v,s.nextReleaseVersion); process.exit(1); } console.log('Release version validated:',v);"

      - name: Production deployment
        if: steps.release_gate.outputs.release == 'true'
        run: |
          echo "Production deployment is authorized by the [deploy-prod] commit gate."
          echo "Vercel deployment is handled by the repository release integration."

      - name: Release bookkeeping
        if: steps.release_gate.outputs.release == 'true'
        run: |
          echo "Release bookkeeping remains enabled for the controlled production release path."
