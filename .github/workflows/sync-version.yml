name: CI, automatic patch versioning, and controlled Vercel release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Authorize the controlled production deployment'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: main-release-pipeline
  cancel-in-progress: false

jobs:
  release-pipeline:
    if: >-
      !contains(github.event.head_commit.message, '[skip-release-pipeline]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run full CI
        run: npm test
      - name: Determine release request
        id: gate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$COMMIT_MESSAGE" == *"[deploy-prod]"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_prod }}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump patch version and sync metadata
        if: github.event_name == 'push' && steps.gate.outputs.release == 'false' && !contains(github.event.head_commit.message, '[skip-version-automation]') && !contains(github.event.head_commit.message, '[major-release]')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          version_path=Path('api/version.js'); current=re.search(r'ADDON_VERSION = "([^"]+)"',version_path.read_text()).group(1)
          major,minor,patch=map(int,current.split('.')); next_version=f'{major}.{minor}.{patch+1}'
          version_path.write_text(f'export const ADDON_VERSION = "{next_version}";\n')
          package_path=Path('package.json'); package=json.loads(package_path.read_text()); package['version']=next_version; package_path.write_text(json.dumps(package,indent=2)+'\n')
          readme=Path('README.md'); text=readme.read_text(); text=re.sub(r'(?m)^(# Anime Releases for Nuvio — v)\d+\.\d+\.\d+',rf'\g<1>{next_version}',text); text=re.sub(r'(?m)^(\- \*\*Development version:\*\* `)\d+\.\d+\.\d+(`)',rf'\g<1>{next_version}\g<2>',text); readme.write_text(text)
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+mbmelgo@users.noreply.github.com; git add api/version.js package.json README.md; git commit -m "chore: bump patch version [skip-release-pipeline]"; git push
      - name: Validate release state
        if: steps.gate.outputs.release == 'true'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          state=json.loads(Path('ops/release-state.json').read_text()); version=re.search(r'ADDON_VERSION = "([^"]+)"',Path('api/version.js').read_text()).group(1); expected=state['nextReleaseVersion']
          if state['paused'] or state['deploymentsSincePause'] >= state['deploymentLimit']: raise SystemExit('Deployment checkpoint reached.')
          if version != expected: raise SystemExit(f'Production version {version} does not match next release baseline {expected}.')
          PY
      - name: Trigger Vercel deployment
        if: steps.gate.outputs.release == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: test -n "$VERCEL_DEPLOY_HOOK_URL" && curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
      - name: Production smoke test
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          expected="$(sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p' api/version.js)"
          for attempt in $(seq 1 30); do
            root_manifest="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/manifest.json || true)"; catalog="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/catalog/anime/current_season.json || true)"; meta_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://nuvio-anime-releases-addon-rho.vercel.app/meta/series/mal%3A39535.json || true)"
            if EXPECTED="$expected" ROOT="$root_manifest" CATALOG="$catalog" META_STATUS="$meta_status" python - <<'PY'
          import json,os,re
          root=json.loads(os.environ['ROOT']); catalog=json.loads(os.environ['CATALOG']); expected=os.environ['EXPECTED']
          assert root.get('version')==expected and root.get('id')=='com.marki.nuvio.anime-releases'; assert root.get('resources') == [{"name":"catalog","types":["anime"]}]; assert os.environ['META_STATUS']=='404'; metas=catalog.get('metas',[]); assert metas; assert all(re.match(r'^(tt\d+|tvdb:\d+|tmdb:\d+)$',str(m.get('id',''))) for m in metas)
          PY
            then echo "Production smoke test passed."; exit 0; fi; sleep 5
          done
          exit 1
      - name: Create annotated release tag and update release state
        if: steps.gate.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"; release_version="$(python -c 'import json;print(json.load(open("ops/release-state.json"))["nextReleaseVersion"])')"; tag="v$release_version"; git fetch --tags --force
          previous="$(git tag --merged "$target^" --sort=-version:refname --list 'v*' | head -n1 || true)"
          if [ -n "$previous" ]; then range="$previous..$target"; else range="$target"; fi
          summary="$(python - "$range" "$tag" <<'PY'
          import subprocess,sys,re
          commit_range,tag=sys.argv[1:]; subjects=subprocess.check_output(['git','log','--reverse','--no-merges','--pretty=format:%s',commit_range],text=True).splitlines(); seen=set(); highlights=[]; categories=[]
          for subject in subjects:
              subject=re.sub(r'\s*\[[^]]+\]','',subject).strip(); kind,sep,text=subject.partition(': '); kind=kind.lower() if sep else ''; text=text.strip() if sep else subject.strip()
              if kind in {'chore','test','release'}: continue
              if kind=='fix': categories.append('reliability'); line=text
              elif kind in {'feat','feature'}: categories.append('features'); line=text
              elif kind=='refactor': categories.append('maintenance'); line='Improved the internal organization and reliability of the addon.'
              elif kind=='perf': categories.append('performance'); line='Improved addon performance and efficiency.'
              elif kind in {'docs','documentation'}: categories.append('documentation'); line='Improved documentation and guidance.'
              else: continue
              line=re.sub(r'\bTVDB\b','metadata matching',line,flags=re.I); line=re.sub(r'\bMAL-Sync\b','anime identity matching',line,flags=re.I); line=re.sub(r'\bKitsu-only\b','alternate anime identity',line,flags=re.I); line=re.sub(r'\bKitsu\b','anime identity data',line,flags=re.I); line=re.sub(r'\bcanonical(?:ization|izer)?\b','anime matching',line,flags=re.I); line=re.sub(r'\bresolver\b','matching system',line,flags=re.I); line=re.sub(r'\bprovider adapters?\b','data-source handling',line,flags=re.I); line=re.sub(r'\s+',' ',line).strip().rstrip('.')+'.'; key=line.lower()
              if key not in seen: seen.add(key); highlights.append(line)
          overview=[]
          if 'features' in categories: overview.append('This release adds new user-facing functionality.')
          if 'reliability' in categories: overview.append('It improves reliability and accuracy when identifying anime across different sources.')
          if 'maintenance' in categories: overview.append('It also improves the internal structure of the addon to make future fixes safer and more reliable.')
          if 'performance' in categories: overview.append('It includes performance and efficiency improvements.')
          if not overview: overview=['This release contains improvements to the addon.']
          print(f'Release {tag}\n\nOverview'); [print(s) for s in overview]; print('\nHighlights'); [print(f'- {line}') for line in highlights[:12]]
          if not highlights: print('- General reliability and maintenance improvements.')
          PY
          )"
          git config user.name github-actions[bot]; git config user.email 41898282+users.noreply.github.com
          git tag -a "$tag" "$target" -m "$summary"; git push origin "refs/tags/$tag"
          git pull --rebase origin main
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('ops/release-state.json'); state=json.loads(path.read_text()); version=state['nextReleaseVersion']; major,minor,patch=map(int,version.split('.')); deployments=state['deploymentsSincePause']+1; state['deploymentsSincePause']=deployments; state['totalDeployments']+=1; state['paused']=deployments>=state['deploymentLimit']; state['lastDeploymentSha']='${{ github.sha }}'; state['lastDeploymentId']=''; state['lastDeploymentVersion']=version; state['nextReleaseVersion']=f'{major}.{minor+1}.0'; state['lastDeploymentTag']='v'+version; path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git add ops/release-state.json; git commit -m "chore: record $tag production release [skip-release-pipeline]"; git push origin HEAD:main
