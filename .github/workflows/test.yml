name: Unit tests and controlled Vercel deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test

  deploy-production:
    name: Deploy to Vercel production
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment checkpoint
        run: |
          python - <<'PY'
          import json
          state=json.load(open('ops/release-state.json'))
          print(f"Deployment checkpoint: {state['deploymentsSincePause']}/{state['deploymentLimit']}")
          if state['paused'] or state['deploymentsSincePause'] >= state['deploymentLimit']:
              raise SystemExit('Deployment checkpoint reached.')
          PY
      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
      - name: Production smoke test
        run: |
          set -euo pipefail
          expected="$(sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p' api/version.js)"
          for attempt in $(seq 1 30); do
            root_manifest="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/manifest.json || true)"
            v5_manifest="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/v5/manifest.json || true)"
            catalog="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/v5/catalog/series/ongoing.json || true)"
            meta_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://nuvio-anime-releases-addon-rho.vercel.app/meta/series/mal%3A39535.json || true)"
            if EXPECTED="$expected" ROOT="$root_manifest" V5="$v5_manifest" CATALOG="$catalog" META_STATUS="$meta_status" python - <<'PY'
          import json, os, re
          expected = os.environ['EXPECTED']
          root = json.loads(os.environ['ROOT'])
          v5 = json.loads(os.environ['V5'])
          catalog = json.loads(os.environ['CATALOG'])
          assert root.get('version') == expected and root.get('id') == 'com.marki.nuvio.anime-releases.v5'
          assert v5.get('version') == expected and v5.get('id') == 'com.marki.nuvio.anime-releases.v5'
          assert v5.get('resources') == [{"name": "catalog", "types": ["series"]}]
          assert os.environ['META_STATUS'] == '404'
          metas = catalog.get('metas', [])
          assert metas
          assert any(re.match(r'^(tt\d+|tmdb:\d+|tvdb:\d+)$', str(meta.get('id', ''))) for meta in metas)
          PY
            then echo "Production smoke test passed."; exit 0; fi
            sleep 5
          done
          echo "Production smoke test failed."; exit 1
