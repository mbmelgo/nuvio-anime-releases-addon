name: Unit tests and controlled Vercel deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

  deploy-production:
    name: Deploy to Vercel production
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment checkpoint and deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("ops/release-state.json").read_text())
          print(f"Deployment checkpoint: {state['deploymentsSincePause']}/{state['deploymentLimit']}")
          if state["paused"] or state["deploymentsSincePause"] >= state["deploymentLimit"]:
              print("AUTONOMOUS LOOP PAUSED: deployment checkpoint reached.")
              raise SystemExit(0)
          PY

          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          state_path = Path("ops/release-state.json")
          state = json.loads(state_path.read_text())
          state["deploymentsSincePause"] += 1
          state["totalDeployments"] += 1
          state["paused"] = state["deploymentsSincePause"] >= state["deploymentLimit"]

          version_path = Path("api/version.js")
          current = re.search(r'ADDON_VERSION = "([^"]+)"', version_path.read_text()).group(1)
          major, minor, patch = map(int, current.split("."))
          next_version = f"{major}.{minor + 1}.0"

          # Tags identify the exact source commit that was deployed.
          # The tag version is the post-deployment release version.
          tag = f"v{next_version}"
          git_sha = os.environ["GITHUB_SHA"]

          version_path.write_text(f'export const ADDON_VERSION = "{next_version}";\n')

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = next_version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          stremio = Path("api/stremio.js")
          text = stremio.read_text()
          stremio.write_text(re.sub(r'version: "[^"]+"', f'version: "{next_version}"', text, count=1))

          readme = Path("README.md")
          text = readme.read_text()
          text = re.sub(r'\b(?:v|Version )\d+\.\d+\.\d+', lambda m: re.sub(r'\d+\.\d+\.\d+', next_version, m.group(0)), text)
          readme.write_text(text)

          state["lastDeploymentSha"] = git_sha
          state["lastDeploymentVersion"] = current
          state["nextReleaseVersion"] = next_version
          state["lastDeploymentTag"] = tag
          state_path.write_text(json.dumps(state, indent=2) + "\n")

          Path("/tmp/release-tag").write_text(tag + "\n")
          print(json.dumps(state, indent=2))
          print(f"Deployed source commit: {git_sha}")
          print(f"Post-deployment version: {next_version}")
          print(f"Release tag: {tag}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/version.js package.json api/stremio.js README.md ops/release-state.json
          git commit -m "chore: record Vercel deployment and bump release to $(sed -nE 's/.*ADDON_VERSION = "([^"]+)".*/\1/p' api/version.js) [skip-version-automation]"

          release_tag="$(cat /tmp/release-tag)"
          git push
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Release $release_tag"
          git push origin "$release_tag"
