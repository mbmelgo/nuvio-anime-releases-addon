name: Unit tests and controlled Vercel deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test

  deploy-production:
    name: Deploy to Vercel production
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment checkpoint
        run: |
          python - <<'PY'
          import json
          state=json.load(open('ops/release-state.json'))
          print(f"Deployment checkpoint: {state['deploymentsSincePause']}/{state['deploymentLimit']}")
          if state['paused'] or state['deploymentsSincePause'] >= state['deploymentLimit']:
              raise SystemExit('Deployment checkpoint reached.')
          PY
      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
      - name: Production smoke test
        run: |
          set -euo pipefail
          expected="$(sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p' api/version.js)"
          for attempt in $(seq 1 30); do
            root_manifest="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/manifest.json || true)"
            catalog="$(curl --fail --silent --show-error https://nuvio-anime-releases-addon-rho.vercel.app/catalog/series/ongoing.json || true)"
            meta_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://nuvio-anime-releases-addon-rho.vercel.app/meta/series/mal%3A39535.json || true)"
            if EXPECTED="$expected" ROOT="$root_manifest" CATALOG="$catalog" META_STATUS="$meta_status" python - <<'PY'
          import json, os, re
          expected = os.environ['EXPECTED']
          root = json.loads(os.environ['ROOT'])
          catalog = json.loads(os.environ['CATALOG'])
          assert root.get('version') == expected and root.get('id') == 'com.marki.nuvio.anime-releases.v5'
          assert root.get('resources') == [{"name": "catalog", "types": ["series"]}]
          assert os.environ['META_STATUS'] == '404'
          metas = catalog.get('metas', [])
          assert metas
          assert any(re.match(r'^(tt\d+|tmdb:\d+|tvdb:\d+)$', str(meta.get('id', ''))) for meta in metas)
          PY
            then echo "Production smoke test passed."; exit 0; fi
            sleep 5
          done
          echo "Production smoke test failed."; exit 1

  tag-production-release:
    name: Tag production release
    needs: deploy-production
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-prod]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated release tag
        run: |
          set -euo pipefail
          target="$(python -c 'import json;print(json.load(open("ops/release-state.json"))["lastDeploymentSha"])')"
          tag="$(python -c 'import json;print(json.load(open("ops/release-state.json"))["lastDeploymentTag"])')"
          test -n "$target"
          test -n "$tag"
          git fetch --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 0
          fi
          previous="$(git tag --merged "$target^" --sort=-version:refname --list 'v*' | head -n1 || true)"
          if [ -n "$previous" ]; then
            summary="$(git log --reverse --no-merges --pretty=format:'- %s (%h)' "$previous..$target" | head -n 50 || true)"
            since="Changes since $previous:"
          else
            summary="$(git log --reverse --no-merges --pretty=format:'- %s (%h)' "$target" | head -n 50 || true)"
            since="Changes included in this release:"
          fi
          [ -n "$summary" ] || summary='- No source commits to summarize.'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$target" -m "Release $tag

Historical production deployment source commit: $target
$since
$summary"
          git push origin "refs/tags/$tag"
