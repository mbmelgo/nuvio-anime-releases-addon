name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test
      - name: Verify production smoke-test contract
        env:
          ROOT_BASE: https://nuvio-anime-releases-addon-rho.vercel.app
        run: |
          root_manifest="$ROOT_BASE/manifest.json"
          root_meta="$ROOT_BASE/meta/series/mal%3A39535.json"
          root_check='root.get("id") != "com.marki.nuvio.anime-releases.v5"'
          test -n "$root_manifest" -a -n "$root_meta" -a -n "$root_check"
          echo "Production smoke contract: $root_manifest $root_meta"
